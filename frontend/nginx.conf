server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No /api or /ws proxy here: VITE_BACKEND_URL is baked in as an absolute
    # URL at build time (see Dockerfile), so the built app calls the backend
    # directly and never goes through nginx for API/WebSocket traffic.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
