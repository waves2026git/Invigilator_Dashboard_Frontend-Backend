services:
  # The invigilator dashboard backend that used to run here (port 8001) was
  # merged into Exam-Device_Backend (run separately, port 8000) — see that
  # repo's app/routes/{devices,assignments,websocket}.py. This frontend
  # points at the unified backend via VITE_BACKEND_URL.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "8080:80"
    restart: unless-stopped
